<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>CSS Anatomy</title>

  <style>

    /* Основной стиль страницы */

    body {
      background: #F8F8FF;
      font-family: "Comic Sans MS", cursive;
      color: #4E2D2F;
      margin: 20px;
    }

     /* Заголовок первого уровня */

    h1 {
      background: #ffff;
      color: #4E2D2F;
      text-align: center;
      padding: 15px;
      border: 5px double #708A93;
    }
        
     /* Заголовок второго уровня */

    h2 {
      color: #592720;
      background: #ffeaea;
      padding: 10px;
      border-left: 6px solid #592720;
    }

    p {
      background: white;
      padding: 12px;
      line-height: 1.5;
      border-radius: 10px; /* мягкие углы туть*/
    }

    a {
      color: #4E2D2F;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
  color: #EC414F;
}

  </style>
</head>
<body>

  <h1>Вот такая красота есть</h1>

  <h2>…что писать я решительно не знаю</h2>

  <p>
    Тут тоже должно что-то быть
  </p>

  <p>
    Тут тоже что-то надо писать
    а что?
  </p>

  <h2>Все очень плохо</h2>

  <p>
    Потому что информатика — это путь боли и
    красоты
  </p>

  <a href="https://m.vk.com/dialecticgeneration"
     target="_blank"
     rel="noopener noreferrer">
     Но всегда можно побороть юбую депрессию тут
  </a>

</body>
</html>
